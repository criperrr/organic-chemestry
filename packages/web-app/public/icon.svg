<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="6" opacity="0.6"/>
  <!-- Orbits -->
  <g fill="none" stroke="url(#orbitGrad)" stroke-width="14" stroke-linecap="round" opacity="0.85">
    <ellipse cx="256" cy="256" rx="180" ry="68" transform="rotate(-30 256 256)"/>
    <ellipse cx="256" cy="256" rx="180" ry="68" transform="rotate(30 256 256)"/>
    <ellipse cx="256" cy="256" rx="180" ry="68" transform="rotate(90 256 256)"/>
  </g>
  <!-- Orbit Electrons -->
  <circle cx="110" cy="180" r="14" fill="#38bdf8"/>
  <circle cx="400" cy="190" r="14" fill="#f43f5e"/>
  <circle cx="256" cy="430" r="14" fill="#10b981"/>
  <!-- Nucleus Glow & Core -->
  <circle cx="256" cy="256" r="48" fill="url(#coreGrad)"/>
  <circle cx="256" cy="256" r="32" fill="#f8fafc"/>
  <!-- Lightning Accent inside nucleus -->
  <path d="M256 230 L242 258 L256 258 L250 282 L274 252 L260 252 Z" fill="#0f172a"/>
</svg>
