name: Deploy to Production Server

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: 'production-deploy'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build applications
        run: npm run build

      - name: Deploy to Production Server
        if: env.SSH_KEY != ''
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.DEPLOY_USER || 'criper' }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST || 'quimica.redznn.duckdns.org' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" packages/web-app/dist/ "$SSH_USER@$SSH_HOST:/var/www/quimicarush/"
